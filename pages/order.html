<main>
<section class="page-head"><p class="eyebrow">הזמנה</p><h1>הזמנת מגש</h1><p>ממלאים את הפרטים ואני חוזרת אליכם לאישור סופי.</p></section>
<form class="order-form" action="thanks.html" method="get">
<fieldset><legend>פרטי קשר</legend>
<label>שם מלא<input type="text" name="name" required minlength="2" maxlength="40" placeholder="לדוגמה: רחל כהן" autocomplete="name"></label>
<label>טלפון נייד<input type="tel" name="phone" required pattern="05[0-9]{8}" placeholder="0501234567" title="מספר נייד של 10 ספרות המתחיל ב-05"></label>
<label>אימייל<input type="email" name="email" required placeholder="name@example.com"></label>
</fieldset>
<fieldset><legend>פרטי האירוע</legend>
<label>תאריך אספקה<input type="date" name="date" required min="2026-11-09"></label>
<label>שעה<input type="time" name="time" min="08:00" max="21:00" required></label>
<label>סוג האירוע<select name="event" required><option value="">בחרו…</option><option>שבת / חג</option><option>יום הולדת</option><option>אירוע משפחתי</option><option>מתנה</option></select></label>
<label>מספר סועדים<input type="number" name="guests" min="2" max="60" value="8" required></label>
</fieldset>
<fieldset><legend>המגש</legend>
<div class="choices"><label><input type="radio" name="tray" value="fruit" checked>מגש פירות</label><label><input type="radio" name="tray" value="veg">מגש ירקות</label><label><input type="radio" name="tray" value="gift">מארז מתנה</label></div>
<label>פרי אהוב<input type="text" name="fav" list="fruits" placeholder="התחילו להקליד…"></label>
<datalist id="fruits"><option value="אבטיח"><option value="מלון"><option value="ענבים"><option value="קיווי"><option value="אננס"><option value="ליצ׳י"></datalist>
<label>צבע מוביל<input type="color" name="color" value="#d9534f"></label>
<div class="choices"><label><input type="checkbox" name="extra" value="engrave">חריטת שם</label><label><input type="checkbox" name="extra" value="bag">ארוז למתנה</label></div>
<label class="full">הערות ובקשות מיוחדות<textarea name="notes" rows="4" maxlength="300" placeholder="אלרגיות, שם לחריטה, סגנון רצוי…"></textarea></label>
</fieldset>
<div class="actions"><button type="reset" class="btn btn-ghost">איפוס</button><button type="submit" class="btn">שליחת הזמנה</button></div>
</form>
